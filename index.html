<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trainer Math 3.0 — GEN+</title>
    <script>
      // Tema pre-paint: evita flash de fondo blanco antes de montar React.
      try {
        var tmTheme = localStorage.getItem('trainermath-v2:theme') === 'light' ? 'light' : 'dark';
        document.documentElement.dataset.theme = tmTheme;
        document.documentElement.style.background = tmTheme === 'light' ? '#f3f5f9' : '#0b0e14';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
